# Publishes @oblodai-npm/sdk to npm on a version tag.
# Required repo secret: NPM_TOKEN (npm automation token with publish rights).
#
# The gates run in their own job, which never sees the token. The publish job installs from the
# lockfile, builds, and publishes with --ignore-scripts: no dependency code runs in the step that
# holds the token. The package is published with npm provenance.
name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run ci

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Fail loudly here rather than letting `npm publish` fall through to an anonymous 401.
      - name: Check the publish token is present
        run: test -n "$NODE_AUTH_TOKEN" || { echo "::error::NPM_TOKEN is not set on this repository"; exit 1; }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
